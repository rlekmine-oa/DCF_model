[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "valorisation-entreprise"
version = "0.1.0"
description = "Moteur de valorisation d'entreprise (DCF, multiples) adossé aux données d'Aswath Damodaran"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Rayan LEKMINE"}]
dependencies = [
    "pandas>=2.0", "numpy>=1.24", "yfinance>=0.2.40", "plotly>=5.18",
    "xlrd>=2.0", "openpyxl>=3.1", "pyyaml>=6.0",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
valorisation = "valorisation.cli:main"

[tool.setuptools.packages.find]
include = ["valorisation*"]

[tool.setuptools.package-data]
"valorisation.correspondances" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
